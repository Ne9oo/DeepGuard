<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepGuard | Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { 
                        deepbg: '#030712', 
                        cardbg: '#0B1120',
                        primary: '#3b82f6', 
                    }, 
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        tech: ['Orbitron', 'sans-serif'] 
                    }
                } 
            } 
        }
    </script>
    <script>
        // Check localStorage to sync theme with index.html
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-deepbg text-slate-800 dark:text-slate-300 font-sans antialiased min-h-screen flex items-center justify-center relative overflow-hidden transition-colors duration-300 selection:bg-primary/30">

    <!-- Ambient Background Grid (Adapts to Light/Dark) -->
    <div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center">
        <!-- Dark Mode Grid -->
        <div class="absolute inset-0 hidden dark:block bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMCAwaDQwdjQwaC00MHoiIGZpbGw9Im5vbmUiLz48cGF0aCBkPSJNMCAzOWg0MHYxSDB6TDM5IDB2NDBoMXoiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wMykiLz48L3N2Zz4=')]"></div>
        <!-- Light Mode Grid -->
        <div class="absolute inset-0 block dark:hidden bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMCAwaDQwdjQwaC00MHoiIGZpbGw9Im5vbmUiLz48cGF0aCBkPSJNMCAzOWg0MHYxSDB6TDM5IDB2NDBoMXoiIGZpbGw9InJnYmEoMCwwLDAsMC4wMykiLz48L3N2Zz4=')]"></div>
    </div>

    <!-- Signup Card -->
    <div class="w-full max-w-md bg-white/80 dark:bg-cardbg/60 backdrop-blur-2xl border border-slate-200 dark:border-white/5 rounded-3xl p-8 sm:p-10 shadow-2xl relative z-10 mx-4 transition-colors duration-300">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="{{ url_for('index') }}" class="inline-block mb-4 font-tech text-2xl font-bold tracking-wider text-primary">
                DEEPGUARD
            </a>
            <h1 class="text-2xl font-semibold text-slate-900 dark:text-white tracking-wide">Create Account</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Join the defense against synthetic audio.</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-{{ category }}-50 dark:bg-white/5 border border-{{ category }}-200 dark:border-{{ category }}/30 text-{{ category }}-600 dark:text-white px-4 py-3 rounded-lg mb-6 text-sm flex items-start backdrop-blur-md transition-colors">
                        <i class="fa-solid fa-circle-info mt-0.5 mr-3 text-{{ category }}-500 dark:text-{{ category }}-400"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Form -->
        <form action="{{ url_for('signup') }}" method="POST" class="space-y-5">
            
            <!-- Username -->
            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-user text-slate-400 dark:text-slate-500"></i>
                    </div>
                    <input type="text" name="username" required 
                        class="block w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-deepbg/50 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                        placeholder="Enter your username">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-slate-400 dark:text-slate-500"></i>
                    </div>
                    <input type="email" name="email" required 
                        class="block w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-deepbg/50 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                        placeholder="name@example.com">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-400 dark:text-slate-500 text-sm"></i>
                    </div>
                    <input type="password" name="password" id="signup-password" required 
                        class="block w-full pl-11 pr-12 py-3 bg-slate-50 dark:bg-deepbg/50 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                        placeholder="Create a strong password">
                    <button type="button" onclick="togglePassword('signup-password', 'eye-icon-pass')" 
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-white transition-colors focus:outline-none">
                        <i id="eye-icon-pass" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Confirm Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-shield text-slate-400 dark:text-slate-500 text-sm"></i>
                    </div>
                    <input type="password" name="confirm_password" id="signup-confirm" required 
                        class="block w-full pl-11 pr-12 py-3 bg-slate-50 dark:bg-deepbg/50 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm"
                        placeholder="Repeat your password">
                    <button type="button" onclick="togglePassword('signup-confirm', 'eye-icon-confirm')" 
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-white transition-colors focus:outline-none">
                        <i id="eye-icon-confirm" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white py-3.5 rounded-xl font-medium tracking-wide transition-all shadow-lg shadow-primary/30 mt-4 border border-transparent dark:border-white/10">
                Initialize Account
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-8">
            Already registered? <a href="{{ url_for('login') }}" class="text-primary dark:text-white hover:text-blue-600 dark:hover:text-primary font-medium transition-colors border-b border-primary/30 hover:border-primary pb-0.5">Initialize Login</a>
        </p>
    </div>

    <!-- Toggle Password Script -->
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
