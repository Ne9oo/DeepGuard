<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | DeepGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center justify-center selection:bg-blue-500 selection:text-white">
    <div class="text-center relative">
        <h1 class="text-9xl font-extrabold tracking-widest text-gray-800 drop-shadow-lg">404</h1>
        <div class="bg-blue-600 px-2 text-sm rounded rotate-12 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 shadow-lg">
            Access Denied
        </div>
        <h2 class="mt-8 text-3xl font-bold">Dead End Detected.</h2>
        <p class="text-gray-400 mt-4 mb-8 text-lg max-w-md mx-auto">
            The page you are looking for has been deleted, moved, or never existed in our database.
        </p>
        <a href="{{ url_for('index') }}" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-300 shadow-lg shadow-blue-500/30">
            Return to Dashboard
        </a>
    </div>
</body>
</html>
