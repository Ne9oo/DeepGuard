<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepGuard | Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { primary: '#3b82f6', alert: '#ef4444', safe: '#10b981', darkbg: '#0a0f1c', darkcard: '#111827' }, 
                    fontFamily: { sans: ['Inter', 'sans-serif'], tech: ['Orbitron', 'sans-serif'] }
                } 
            } 
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-darkbg text-slate-800 dark:text-slate-300 antialiased h-screen flex items-center justify-center relative transition-colors duration-300">

    <!-- Ambient Background -->
    <div class="absolute w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px] top-[-200px] left-[-100px] pointer-events-none z-0"></div>

    <div class="w-full max-w-md bg-white dark:bg-darkcard/80 backdrop-blur-xl border border-slate-200 dark:border-white/10 rounded-[2rem] p-10 shadow-2xl relative z-10">
        
        <div class="text-center mb-8">
            <i class="fa-solid fa-shield-halved text-primary text-4xl mb-3"></i>
            <h1 class="text-3xl font-bold text-slate-900 dark:text-white font-tech tracking-wider">DeepGuard</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2">Welcome back to the forensics engine.</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-{{ category }}/10 border border-{{ category }}/30 text-{{ category }} px-4 py-3 rounded-xl mb-6 text-sm flex items-center">
                        <i class="fa-solid fa-circle-info mr-3"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email Address</label>
                <input type="email" name="email" required 
                    class="block w-full px-4 py-3 bg-slate-50 dark:bg-darkbg border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                <!-- Relative container for the eye button -->
                <div class="relative">
                    <input type="password" name="password" id="login-password" required 
                        class="block w-full px-4 py-3 bg-slate-50 dark:bg-darkbg border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all pr-12">
                    
                    <!-- Eye Button -->
                    <button type="button" onclick="togglePassword('login-password', 'eye-icon-login')" 
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors focus:outline-none">
                        <i id="eye-icon-login" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white py-3.5 rounded-xl font-semibold transition-all shadow-lg shadow-primary/30">
                Log In
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-8">
            Don't have an account? <a href="{{ url_for('signup') }}" class="text-primary hover:text-blue-400 font-medium transition-colors">Sign up here</a>
        </p>
    </div>

    <!-- Toggle Password Script -->
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
