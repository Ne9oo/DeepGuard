<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepGuard | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { deepbg: '#030712', cardbg: '#0B1120', primary: '#3b82f6', primaryHover: '#2563eb', alert: '#ef4444', safe: '#10b981' }, fontFamily: { sans: ['Inter', 'sans-serif'], tech: ['Orbitron', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 dark:bg-deepbg text-slate-800 dark:text-slate-300 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative selection:bg-primary/30">

    <div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center">
        <div class="absolute inset-0 hidden dark:block bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMCAwaDQwdjQwaC00MHoiIGZpbGw9Im5vbmUiLz48cGF0aCBkPSJNMCAzOWg0MHYxSDB6TDM5IDB2NDBoMXoiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wMykiLz48L3N2Zz4=')]"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <a href="/" class="inline-block text-2xl font-bold text-slate-900 dark:text-white tracking-widest uppercase font-tech">DeepGuard</a>
        </div>

        <div class="bg-white/80 dark:bg-cardbg/80 backdrop-blur-xl border border-slate-200 dark:border-white/10 p-8 sm:p-10 rounded-[2rem] shadow-xl">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2 text-center">Reset Password</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-8 text-center">Enter your email and we'll send you a link to get back into your account.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 px-4 py-3 rounded-xl flex items-center text-sm shadow-sm {% if category == 'alert' %}bg-alert-50 dark:bg-alert/10 text-alert-600 dark:text-alert border border-alert-200 dark:border-alert/30{% else %}bg-safe-50 dark:bg-safe/10 text-safe-600 dark:text-safe border border-safe-200 dark:border-safe/30{% endif %}">
                            <i class="fa-solid {% if category == 'alert' %}fa-triangle-exclamation{% else %}fa-circle-check{% endif %} mr-2"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('reset_request') }}" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-regular fa-envelope text-slate-400 dark:text-slate-500"></i>
                        </div>
                        <input type="email" name="email" required class="block w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-deepbg/50 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white py-3.5 rounded-xl font-medium tracking-wide transition-all shadow-lg shadow-primary/30 text-sm">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="{{ url_for('login') }}" class="text-sm font-semibold text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-white transition-colors">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
